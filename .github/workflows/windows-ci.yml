name: Windows CI

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Domain
        working-directory: windows
        run: dotnet test YijianRili.Domain.Tests/YijianRili.Domain.Tests.csproj -c Release --verbosity minimal

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: windows
        run: dotnet restore YijianRili.sln
      - name: Test Domain
        working-directory: windows
        run: dotnet test YijianRili.Domain.Tests/YijianRili.Domain.Tests.csproj -c Release --verbosity minimal
      - name: Build App (MSIX)
        working-directory: windows
        run: >
          dotnet build YijianRili.App/YijianRili.App.csproj
          -c Release
          -p:Platform=x64
          -p:AppxPackageSigningEnabled=false
          --verbosity minimal
