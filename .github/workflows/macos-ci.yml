name: macOS CI

on:
  push:
    branches:
      - master
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/macos-ci.yml'

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint comments
        run: make lint
